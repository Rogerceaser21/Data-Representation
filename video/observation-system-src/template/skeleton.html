<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,500;1,600&family=Shadows+Into+Light&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="styles/dashboard.css" />
    <link rel="stylesheet" href="styles/scenes.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <!-- GENERATED FILE. Edit template/composition.html and run: node scripts/build.mjs -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">

      <audio id="narration" class="clip" data-start="0" data-duration="{{TOTAL}}" data-volume="1" src="assets/narration.mp3"></audio>
      <!-- bgm ships PRE-BAKED: Lyria 3 Pro bed (drive1), ducked against this exact narration, fades in the file, so preview = render -->
      <audio id="bgm" class="clip" data-start="0" data-duration="{{TOTAL}}" data-volume="1" src="assets/music.mp3"></audio>

      <div class="bgwash" style="z-index:0"></div>

      <!-- ============ 1 . COVER (the journey spine; a fragment like every other scene) ============ -->
      <!-- @@SECTION:s01_cover@@ -->
      <!-- the three step transitions: the cover's spine hands the stage to one
           node at a time. Same .jscene geometry, so t1 match cuts from s01. -->
      <!-- @@SECTION:t1_step1@@ -->
      <!-- ---- act 1 . the observation itself ---- -->
      <!-- @@SECTION:s02_form@@ -->
      <!-- @@SECTION:s03_scale@@ -->
      <!-- @@SECTION:s04_pad@@ -->
      <!-- @@SECTION:s05_lock@@ -->
      <!-- @@SECTION:s06_pipeline@@ -->
      <!-- @@SECTION:t2_step2@@ -->
      <!-- ---- act 2 . the collected evidence: story, the data set, progression,
                  the references under it, the report, coverage ---- -->
      <!-- @@SECTION:s07_story@@ -->
      <!-- the data set: v2.4 scene, sits after the dashboard story in scenes.json -->
      <!-- @@SECTION:s16_dataset@@ -->
      <!-- @@SECTION:s09_movement@@ -->
      <!-- @@SECTION:t4_magic@@ -->
      <!-- the magic transition: NOT a spine scene. Own geometry (citations
           collapsing into one gold core), navy stage + seeded sky only, so the
           cut in from s08 and out into s13 matches the other navy scenes. -->
      <!-- @@SECTION:s08_evidence@@ -->
      <!-- @@SECTION:s13_report@@ -->
      <!-- @@SECTION:s10_coverage@@ -->
      <!-- @@SECTION:t3_step3@@ -->
      <!-- ---- act 3 . the coaching plan ---- -->
      <!-- @@SECTION:s11_teacher@@ -->
      <!-- @@SECTION:s12_portal@@ -->

      <!-- ============ 15 . CLOSE (the loop; a fragment like every other scene) ============ -->
      <!-- @@SECTION:s15_close@@ -->

      <!-- ============ 16 . END CARD (silent, back to the cover) ============ -->
      <section class="scene navy clip" id="sc16" data-start="{{START:s16_end}}" data-duration="{{DUR:s16_end}}" data-track-index="1">
        <div class="sbody" style="justify-content:center">
          <div class="stars" id="endStars" data-layout-allow-overflow></div>
          <div style="position:relative;z-index:2">
            <div class="coverk">The Observation System</div>
            <h1 class="coverh" id="s16h" style="font-size:62px;line-height:1.14;max-width:22ch">Better <em>never</em> stops.</h1>
          </div>
        </div>
      </section>
    </div>

    <script>
      /* Deterministic star field for the cover and the end card (no Math.random: seeded LCG). */
      (function () {
        var seed = 20260729, n = 130, html = '';
        function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
        for (var i = 0; i < n; i++) {
          var s = 1 + rnd() * 2.2, x = rnd() * 100, y = rnd() * 100, o = 0.18 + rnd() * 0.62;
          html += '<i style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;width:' + s.toFixed(2) +
            'px;height:' + s.toFixed(2) + 'px;opacity:' + o.toFixed(2) + '"></i>';
        }
        document.getElementById('coverStars').innerHTML = html;
        document.getElementById('endStars').innerHTML = html;
        /* every other navy spine scene (t1/t2/t3, s15) opts in with
           data-stars-seed and gets the SAME field, so the cuts between them
           never reshuffle the sky. */
        document.querySelectorAll('.stars[data-stars-seed]').forEach(function (el) { el.innerHTML = html; });
      })();

      /* Cue times are derived from the narration track, injected at build time,
         so re-cutting a line moves the animation with it. */
      var NARR = {{TIMINGS}};
      function at(id, off) { return NARR[id].start + (off || 0); }
      // proportional cue: frac of the scene's narration length, so a shorter
      // line compresses its choreography instead of losing the tail of it
      function atf(id, frac) { return NARR[id].start + frac * NARR[id].dur; }
      // spotlight: soft gold ring + slight lift while the narrator names the
      // element, then release. Resting state is the natural one (enhancement only).
      function spotlight(sel, when, hold) {
        tl.fromTo(sel, { boxShadow: '0 0 0 0px rgba(201,137,12,0)' },
          { boxShadow: '0 0 0 3px rgba(201,137,12,.85), 0 0 26px 2px rgba(201,137,12,.28)',
            scale: 1.03, duration: 0.45, ease: 'power2.out', immediateRender: false }, when)
          .to(sel, { boxShadow: '0 0 0 0px rgba(201,137,12,0)', scale: 1,
            duration: 0.6, ease: 'power2.inOut' }, when + (hold || 2.0));
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function countUp(sel, when, dur) {
        document.querySelectorAll(sel).forEach(function (el, i) {
          var target = +el.dataset.count, o = { v: 0 };
          tl.to(o, {
            v: target, duration: dur || 1.4, ease: 'power2.out',
            onUpdate: function () { el.textContent = Math.round(o.v); }
          }, when + i * 0.28);
        });
      }

      /* @@CUES:s01_cover@@ */
      /* @@CUES:t1_step1@@ */
      /* @@CUES:s02_form@@ */
      /* @@CUES:s03_scale@@ */
      /* @@CUES:s04_pad@@ */
      /* @@CUES:s05_lock@@ */
      /* @@CUES:s06_pipeline@@ */
      /* @@CUES:t2_step2@@ */
      /* @@CUES:s07_story@@ */
      /* @@CUES:s16_dataset@@ */
      /* @@CUES:s09_movement@@ */
      /* @@CUES:t4_magic@@ */
      /* @@CUES:s08_evidence@@ */
      /* @@CUES:s13_report@@ */
      /* @@CUES:s10_coverage@@ */
      /* @@CUES:t3_step3@@ */
      /* @@CUES:s11_teacher@@ */
      /* @@CUES:s12_portal@@ */

      /* @@CUES:s15_close@@ */

      /* 16 . end card (silent, held after the narration) */
      tl.from('#sc16 .coverk', { opacity: 0, y: 12, duration: 0.8 }, at('s16_end', 0.6))
        .from('#s16h', { opacity: 0, y: 22, duration: 1.1, ease: 'power3.out' }, at('s16_end', 0.9))
        .to('#endStars', { y: -18, duration: 7.0, ease: 'none' }, at('s16_end', 0.2));

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
