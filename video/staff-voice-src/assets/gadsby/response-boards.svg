<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Whole class response boards"><title>Whole class response boards</title><desc>Every desk · prep 10 min · 8 seconds</desc><style>
  :root{--ink:#1f2430;--muted:#8b93a3;--line:#c9cedb;--wash:#f2f3f8;--paper:#fff;--accent:#6d4df6;--accent-wash:#ece7ff}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eaf2;--muted:#8d95a8;--line:#3a4157;--wash:#1b2030;--paper:#111521;--accent:#9b86ff;--accent-wash:#241f3d}
  }
  .t{font:600 13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
  .s{font:500 10px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted);letter-spacing:.02em}
  .l{font:500 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
  .lm{font:500 9px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  .la{font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;fill:var(--accent)}
  .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
  .stroke{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fillw{fill:var(--wash)}
  .filla{fill:var(--accent-wash)}
  .fillp{fill:var(--paper)}
  .dash{stroke-dasharray:4 3}
</style><rect x="0" y="0" width="420" height="280" fill="none"/><text x="20" y="26" class="t" text-anchor="start">Whole class response boards</text><text x="20" y="42" class="s" text-anchor="start">Every desk · prep 10 min · 8 seconds</text><g><rect x="40" y="92" width="58" height="38" rx="2" class="fillp"/><rect x="40" y="92" width="58" height="38" rx="2" class="stroke"/><rect x="128" y="92" width="58" height="38" rx="2" class="fillp"/><rect x="128" y="92" width="58" height="38" rx="2" class="stroke"/><rect x="216" y="92" width="58" height="38" rx="2" class="filla"/><rect x="216" y="92" width="58" height="38" rx="2" class="acc"/><rect x="304" y="92" width="58" height="38" rx="2" class="fillp"/><rect x="304" y="92" width="58" height="38" rx="2" class="stroke"/><rect x="40" y="152" width="58" height="38" rx="2" class="fillp"/><rect x="40" y="152" width="58" height="38" rx="2" class="stroke"/><rect x="128" y="152" width="58" height="38" rx="2" class="filla"/><rect x="128" y="152" width="58" height="38" rx="2" class="acc"/><rect x="216" y="152" width="58" height="38" rx="2" class="fillp"/><rect x="216" y="152" width="58" height="38" rx="2" class="stroke"/><rect x="304" y="152" width="58" height="38" rx="2" class="fillp"/><rect x="304" y="152" width="58" height="38" rx="2" class="stroke"/><circle cx="69" cy="142" r="6" class="stroke"/><circle cx="157" cy="142" r="6" class="stroke"/><circle cx="245" cy="142" r="6" class="stroke"/><circle cx="333" cy="142" r="6" class="stroke"/><circle cx="69" cy="202" r="6" class="stroke"/><circle cx="157" cy="202" r="6" class="stroke"/><circle cx="245" cy="202" r="6" class="stroke"/><circle cx="333" cy="202" r="6" class="stroke"/><circle cx="210" cy="222" r="8" class="filla"/><circle cx="210" cy="222" r="8" class="acc"/><text x="210" y="225.2" class="la" text-anchor="middle">T</text><line x1="192" y1="214" x2="124.4" y2="191.5" class="acc dash"/><path d="M120 190 L128.9 190.6 M120 190 L127.5 194.8" class="acc"/><line x1="228" y1="214" x2="295.6" y2="191.5" class="acc dash"/><path d="M300 190 L292.5 194.8 M300 190 L291.1 190.6" class="acc"/><text x="210" y="252" class="lm" text-anchor="middle">scan, say what you saw, then move on or reteach</text><text x="210" y="74" class="la" text-anchor="middle">boards up on three · nothing collected</text></g></svg>