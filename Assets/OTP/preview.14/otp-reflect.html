     shared across this Pages origin). */

<script>
/* ===========================================
   Theme toggle: same mechanism and same localStorage key as the gate and
   the other OTP pages (data-theme attribute on <html>, persisted).
   =========================================== */
(function initTheme() {
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');

  function syncImages(theme) {
    document.querySelectorAll('img[data-light-src][data-dark-src]').forEach(function (img) {
      var next = theme === 'dark' ? img.dataset.darkSrc : img.dataset.lightSrc;
      if (img.getAttribute('src') !== next) img.setAttribute('src', next);
    });
  }
  function applyTheme(theme, persist) {
    if (theme === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    syncImages(theme);
    if (persist) {
      try { localStorage.setItem('ais-form-theme', theme); } catch (e) {}
    }
  }
  window.__otrSyncThemeImages = function () {
    syncImages(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  };
  syncImages(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    });
  }
})();

   otp-v0.14 T2 · Teacher Reflection + Plan
   No Supabase key ships in this build (hard rule 14 family): only the
   public edge function URL, and the token in the link is the only
   credential, exactly like the ungated viewer (otp-record.html).
   =========================================== */
var SB_FN_REFLECT = 'https://rfbetrcevtmisknndpgg.supabase.co/functions/v1/otp-reflect';
var CANONICAL_TOKEN = /^[0-9a-f]{32}$/;
var RETRY_DELAY_MS = 600;
var STORAGE_PREFIX = 'ais-otp-reflect-v1:';
var Q2_LEVELS = ['Beginner', 'Emerging', 'Good', 'Great', 'Outstanding'];
var QUESTIONS = {
  q1: 'How did the lesson go? What worked, and what did not?',
  q2: 'Where was student progress?',
  q3: 'Is there anything your coach should know before you meet?',
  q4: 'What challenges do you expect?',
  q5: 'What are your own ideas to overcome them?',
  q6: 'How will you put them in place, and from when?',
  q7: 'What support do you need and who would be most likely to provide it?',
  q8: 'What change in student learning do you expect, and by when?'
};

// Test-only: ?_tmo=<ms> shortens the per-attempt cap so the resilience
// specs don't have to wait through the real 7s timeout. Unset (the normal
// case, and always on a teacher's own link) leaves it at 7000.
var FETCH_TIMEOUT_MS = (function () {
  try {
    var v = parseInt(new URLSearchParams(location.search).get('_tmo'), 10);
    return v > 0 ? v : 7000;
  } catch (e) { return 7000; }
})();

var CURRENT_TOKEN = '';
var CURRENT_STATE = null;
var CURRENT_KIND = '';
var SENDING = false;
var draftTimer = null;

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function getToken() {
  try { return String(new URLSearchParams(location.search).get('t') || '').trim(); }
  catch (e) { return ''; }
}

/* Mirrors the tracker's own fmtDayShort (STRIP-003 rule): a date-only value
   is a calendar date, parsed by hand as local, never through
   `new Date('YYYY-MM-DD')`. */
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDayShort(v) {
  if (!v) return '';
  var s = String(v);
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  try {
    var d = m
      ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]))
      : new Date(s);
    if (isNaN(d)) return s;
    return String(d.getDate()).padStart(2, '0') + ' ' + MONTHS[d.getMonth()];
  } catch (e) { return s; }
}

/* ===========================================
   Local draft: autosave to localStorage key
   ais-otp-reflect-v1:<first 8 chars of t>, debounced, restored on load,
   cleared after a successful send.
   =========================================== */
function draftKey(token) {
  return STORAGE_PREFIX + String(token || '').slice(0, 8);
}
function loadDraft(token) {
  try { return JSON.parse(localStorage.getItem(draftKey(token)) || 'null'); }
  catch (e) { return null; }
}
function saveDraftNow() {
  if (!CURRENT_TOKEN) return;
  try { localStorage.setItem(draftKey(CURRENT_TOKEN), JSON.stringify(currentValues())); }
  catch (e) {}
}
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 220);
}
function clearDraft(token) {
  try { localStorage.removeItem(draftKey(token)); } catch (e) {}
}
function restoreDraft() {
  var d = loadDraft(CURRENT_TOKEN);
  if (!d) return;
  ['q1', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && !el.readOnly && d[id]) el.value = d[id];
  });
  var q2c = document.getElementById('q2_comment');
  if (q2c && !q2c.readOnly && d.q2_comment) q2c.value = d.q2_comment;
  if (d.q2_level) {
    var btn = document.querySelector('#q2_level_group .pill[data-value="' + d.q2_level.replace(/"/g, '\\"') + '"]');
    if (btn) {
      document.querySelectorAll('#q2_level_group .pill').forEach(function (p) { p.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    }
  }
}

/* ===========================================
   Fetch helpers: each attempt capped via AbortController (NOT
   AbortSignal.timeout, iOS 16+ only). No apikey / Authorization header (the
   edge function is deployed --no-verify-jwt and this build carries no key),
   mirroring the ungated viewer's keyless otp-record read.
   =========================================== */
async function fetchJSON(url, opts) {
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
  try {
    var o = Object.assign({ signal: controller.signal }, opts || {});
    var resp = await fetch(url, o);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } finally {
    clearTimeout(timer);
  }
}

function showLoading(on) {
  document.getElementById('form-loading').classList.toggle('is-hidden', !on);
}

/* hard rule 12: no error UI, ever. A bad/expired/missing link gets the same
   calm card the ungated viewer shows for a missing record, reusing the
   loading overlay's card the same way showViewerLanding does. */
function showBadLink() {
  var card = document.getElementById('form-loading-card');
  card.innerHTML = '';
  var note = document.createElement('div');
  note.className = 'form-loading-note';
  note.id = 'otr-badlink-text';
  note.textContent = 'This link is not valid or has expired. Ask your coach for a new link.';
  card.appendChild(note);
  showLoading(true);
}

/* ===========================================
   Load state, with hard rule 12 (no error UI, ever): each attempt is
   capped, a stall / non-2xx / unexpected shape retries silently behind the
   loading overlay; after 8 attempts a single guarded reload (?_r=1) gives a
   wedged tab a clean context. A definitive success:false (bad/expired
   token) is shown once, calmly, and never retried. Mirrors
   otp-tracker.html's loadTracker.
   =========================================== */
async function loadState() {
  var token = getToken();
  if (!CANONICAL_TOKEN.test(token)) { showBadLink(); return; }
  CURRENT_TOKEN = token;
  showLoading(true);
  for (var attempt = 1; ; attempt++) {
    var data = null;
    try { data = await fetchJSON(SB_FN_REFLECT + '?t=' + encodeURIComponent(token), { method: 'GET' }); }
    catch (e) { data = null; }

    if (data && data.success === true && data.state && data.state.found === true) {
      CURRENT_STATE = data.state;
      showLoading(false);
      renderView(deriveView(CURRENT_STATE));
      return;
    }
    if (data && data.success === false) {
      showBadLink();
      return;
    }
    if (attempt >= 8) {
      if (location.search.indexOf('_r=') === -1) {
        var sep = location.search ? '&' : '?';
        location.replace(location.href + sep + '_r=1');
      }
      return;
    }
    await sleep(RETRY_DELAY_MS);
  }
}

/* ===========================================
   View derivation + render
   =========================================== */
function deriveView(state) {
  var owed = state.owed || [];
  var has1 = owed.indexOf(1) !== -1;
  var has2 = owed.indexOf(2) !== -1;
  if (!has1 && !has2) return 'thankyou';
  if (has1 && has2) return 'both';
  if (has1) return 'part1';
  return 'part2';
}

function requiredFieldsFor(kind) {
  var req = [];
  if (kind === 'part1' || kind === 'both') req = req.concat(['q1', 'q2_level', 'q3']);
  if (kind === 'part2' || kind === 'both') req = req.concat(['q4', 'q5', 'q6', 'q7', 'q8']);
  return req;
}

function currentValues() {
  var v = {};
  ['q1', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) v[id] = el.value;
  });
  var q2c = document.getElementById('q2_comment');
  if (q2c) v.q2_comment = q2c.value;
  var sel = document.querySelector('#q2_level_group .pill.is-selected');
  v.q2_level = sel ? sel.dataset.value : '';
  return v;
}
function missingFields(kind) {
  var v = currentValues();
  return requiredFieldsFor(kind).filter(function (k) { return !String(v[k] || '').trim(); });
}
function updateSendState() {
  var btn = document.getElementById('otr-send');
  if (!btn) return;
  btn.classList.toggle('disabled', missingFields(CURRENT_KIND).length > 0);
}
function outlineMissing(keys) {
  (keys || []).forEach(function (k) {
    if (k === 'q2_level') {
      var g = document.getElementById('q2_level_group');
      if (g) g.classList.add('needs-value');
    } else {
      var el = document.getElementById(k);
      if (el) el.classList.add('needs-value');
    }
  });
}
function clearOutlines() {
  document.querySelectorAll('.needs-value').forEach(function (el) { el.classList.remove('needs-value'); });
}
function onFieldInput() {
  this.classList.remove('needs-value');
  updateSendState();
  scheduleDraftSave();
}
function onQ2Click(e) {
  document.querySelectorAll('#q2_level_group .pill').forEach(function (p) { p.classList.remove('is-selected'); });
  e.currentTarget.classList.add('is-selected');
  var group = document.getElementById('q2_level_group');
  if (group) group.classList.remove('needs-value');
  updateSendState();
  scheduleDraftSave();
}

/* ===========================================
   DOM builders. Every teacher-derived string (answers, names) goes through
   textContent, never innerHTML.
   =========================================== */
function buildHeader(kind) {
  var header = document.createElement('header');
  header.className = 'otr-header';
  var brandRow = document.createElement('div');
  brandRow.className = 'brand-row';
  var img = document.createElement('img');
  img.dataset.lightSrc = '../../brand/AIS Logo/AIS Navy.png';
  img.dataset.darkSrc = '../../brand/AIS Logo/AIS White.png';
  img.src = img.dataset.lightSrc;
  img.alt = 'Australian International School Sharjah';
  brandRow.appendChild(img);

  var titleBlock = document.createElement('div');
  titleBlock.className = 'form-title-block';
  var eyebrow = document.createElement('span');
  eyebrow.className = 'form-eyebrow';
  var stripe = document.createElement('span');
  stripe.className = 'stripe';
  eyebrow.appendChild(stripe);
  eyebrow.appendChild(document.createTextNode('AIS Sharjah · Teacher Reflection'));
  titleBlock.appendChild(eyebrow);

  var h1 = document.createElement('h1');
  h1.className = 'form-title';
  h1.id = 'otr-title';
  if (kind === 'part1') {
    h1.appendChild(document.createTextNode('Your view of '));
    var em1 = document.createElement('em'); em1.textContent = 'the lesson'; h1.appendChild(em1);
  } else if (kind === 'thankyou') {
    h1.textContent = 'Thank you.';
  } else {
    h1.appendChild(document.createTextNode('Your '));
    var em2 = document.createElement('em'); em2.textContent = 'plan'; h1.appendChild(em2);
  }
  titleBlock.appendChild(h1);

  if (kind === 'thankyou') {
    var sub = document.createElement('p');
    sub.className = 'otr-thanks-sub';
    sub.id = 'otr-thanks-sub';
    sub.textContent = 'Your answers are sent.';
    titleBlock.appendChild(sub);
  }

  brandRow.appendChild(titleBlock);
  header.appendChild(brandRow);
  return header;
}

function buildMeta(state) {
  var p = document.createElement('p');
  p.className = 'otr-meta';
  var gradeSubject = [state.grade, state.subject].filter(Boolean).join(' ');
  var pieces = ['Observation ' + state.lap, gradeSubject, fmtDayShort(state.observation_date), 'Coach: ' + state.observer].filter(Boolean);
  p.textContent = pieces.join(' · ');
  return p;
}

function buildLockNote() {
  var div = document.createElement('div');
  div.className = 'otr-lock';
  var icon = document.createElement('span');
  icon.className = 'otr-lock-icon';
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = '🔒';
  var text = document.createElement('span');
  text.textContent = "Three short questions, about 5 minutes. Your coach's notes open for you as soon as you send your answers. We ask first so your view of the lesson is your own.";
  div.appendChild(icon);
  div.appendChild(text);
  return div;
}

function buildOwedNote() {
  var p = document.createElement('p');
  p.className = 'otr-owed-note';
  p.textContent = 'You have not sent questions 1 to 3 yet, so they are here too.';
  return p;
}

function buildNextSteps(state) {
  var div = document.createElement('div');
  div.className = 'prev-ns prev-ns-echo';
  var head = document.createElement('span');
  head.className = 'prev-ns-head';
  head.textContent = 'NEXT STEPS AGREED WITH YOUR COACH · OBSERVATION ' + state.lap;
  div.appendChild(head);
  var ol = document.createElement('ol');
  ol.className = 'prev-ns-list';
  (state.next_steps || []).forEach(function (s) {
    if (!s || !String(s).trim()) return;
    var li = document.createElement('li');
    li.textContent = s;
    ol.appendChild(li);
  });
  div.appendChild(ol);
  return div;
}

function buildQuestionSection(num, id, opts) {
  opts = opts || {};
  var section = document.createElement('section');
  section.className = 'form-section';
  var q = document.createElement('p');
  q.className = 'otr-q';
  var b = document.createElement('b');
  b.textContent = String(num);
  q.appendChild(b);
  q.appendChild(document.createTextNode(QUESTIONS[id]));
  section.appendChild(q);

  var ta = document.createElement('textarea');
  ta.className = 'long-text';
  ta.id = id;
  ta.rows = opts.rows || 3;
  ta.maxLength = 4000;
  if (opts.readOnly) {
    ta.readOnly = true;
    ta.value = opts.value || '';
  } else {
    ta.placeholder = 'Your answer…';
    ta.value = opts.value || '';
    ta.addEventListener('input', onFieldInput);
  }
  section.appendChild(ta);
  return section;
}

function buildQ2Section(opts) {
  opts = opts || {};
  var section = document.createElement('section');
  section.className = 'form-section';
  var q = document.createElement('p');
  q.className = 'otr-q';
  var b = document.createElement('b');
  b.textContent = '2';
  q.appendChild(b);
  q.appendChild(document.createTextNode(QUESTIONS.q2));
  if (!opts.readOnly) {
    var star = document.createElement('span');
    star.className = 'otr-required';
    star.textContent = '*';
    q.appendChild(star);
  }
  section.appendChild(q);

  var group = document.createElement('div');
  group.className = 'pill-group';
  group.id = 'q2_level_group';
  Q2_LEVELS.forEach(function (lvl) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pill';
    btn.dataset.value = lvl;
    btn.textContent = lvl;
    if (lvl === opts.level) btn.classList.add('is-selected');
    if (opts.readOnly) btn.disabled = true;
    else btn.addEventListener('click', onQ2Click);
    group.appendChild(btn);
  });
  section.appendChild(group);

  var hasComment = !!(opts.comment && String(opts.comment).trim());
  if (!opts.readOnly || hasComment) {
    var comment = document.createElement('textarea');
    comment.className = 'long-text';
    comment.id = 'q2_comment';
    comment.rows = 2;
    comment.maxLength = 4000;
    comment.style.marginTop = '0.6rem';
    if (opts.readOnly) {
      comment.readOnly = true;
      comment.value = opts.comment || '';
    } else {
      comment.placeholder = 'Add a comment if you want (optional)…';
      comment.value = opts.comment || '';
      comment.addEventListener('input', onFieldInput);
    }
    section.appendChild(comment);
  }
  return section;
}

function buildBar() {
  var bar = document.createElement('div');
  bar.className = 'otr-bar';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'action-btn submit disabled';
  btn.id = 'otr-send';
  btn.textContent = 'Send my answers';
  btn.addEventListener('click', onSendClick);
  bar.appendChild(btn);
  return bar;
}

function buildViewLink(token) {
  var bar = document.createElement('div');
  bar.className = 'otr-bar';
  var a = document.createElement('a');
  a.className = 'action-btn primary';
  a.id = 'otr-view-link';
  a.href = 'otp-record.html?t=' + encodeURIComponent(token);
  a.textContent = 'View your observation';
  bar.appendChild(a);
  return bar;
}

function setFieldsDisabled(on) {
  document.querySelectorAll('#otr-shell textarea:not([readonly])').forEach(function (t) { t.disabled = on; });
  document.querySelectorAll('#otr-shell #q2_level_group .pill').forEach(function (p) { p.disabled = on; });
}

function renderView(kind) {
  var shell = document.getElementById('otr-shell');
  shell.innerHTML = '';
  shell.appendChild(buildHeader(kind));
  shell.appendChild(buildMeta(CURRENT_STATE));

  if (kind === 'thankyou') {
    if (CURRENT_STATE.part1) {
      var a1 = CURRENT_STATE.part1.answers || {};
      shell.appendChild(buildQuestionSection(1, 'q1', { readOnly: true, value: a1.q1, rows: 4 }));
      shell.appendChild(buildQ2Section({ readOnly: true, level: a1.q2_level, comment: a1.q2_comment }));
      shell.appendChild(buildQuestionSection(3, 'q3', { readOnly: true, value: a1.q3 }));
    }
    if (CURRENT_STATE.part2) {
      shell.appendChild(buildNextSteps(CURRENT_STATE));
      var a2 = CURRENT_STATE.part2.answers || {};
      shell.appendChild(buildQuestionSection(4, 'q4', { readOnly: true, value: a2.q4 }));
      shell.appendChild(buildQuestionSection(5, 'q5', { readOnly: true, value: a2.q5 }));
      shell.appendChild(buildQuestionSection(6, 'q6', { readOnly: true, value: a2.q6 }));
      shell.appendChild(buildQuestionSection(7, 'q7', { readOnly: true, value: a2.q7 }));
      shell.appendChild(buildQuestionSection(8, 'q8', { readOnly: true, value: a2.q8 }));
    }
    if (CURRENT_STATE.view_unlocked) shell.appendChild(buildViewLink(CURRENT_TOKEN));
    CURRENT_KIND = kind;
  } else {
    if (kind === 'part1') shell.appendChild(buildLockNote());
    if (kind === 'both') shell.appendChild(buildOwedNote());

    if (kind === 'part1' || kind === 'both') {
      shell.appendChild(buildQuestionSection(1, 'q1', { rows: 4 }));
      shell.appendChild(buildQ2Section({}));
      shell.appendChild(buildQuestionSection(3, 'q3', {}));
    }
    if (kind === 'part2' || kind === 'both') {
      shell.appendChild(buildNextSteps(CURRENT_STATE));
      shell.appendChild(buildQuestionSection(4, 'q4', {}));
      shell.appendChild(buildQuestionSection(5, 'q5', {}));
      shell.appendChild(buildQuestionSection(6, 'q6', {}));
      shell.appendChild(buildQuestionSection(7, 'q7', {}));
      shell.appendChild(buildQuestionSection(8, 'q8', {}));
    }
    shell.appendChild(buildBar());
    CURRENT_KIND = kind;
    restoreDraft();
    updateSendState();
  }

  if (window.__otrSyncThemeImages) window.__otrSyncThemeImages();
  shell.hidden = false;
}

/* ===========================================
   Send: client-side validation first (grey button + tap outlines missing,
   no network call at all if invalid). Once valid: a network failure
   retries silently while the button shows "Sending…" (hard rule 12); a
   definitive missing_answers business error outlines the server's own
   list; any other business miss is treated calmly by re-fetching state.
   =========================================== */
async function onSendClick() {
  if (SENDING) return;
  var btn = document.getElementById('otr-send');
  clearOutlines();
  var missing = missingFields(CURRENT_KIND);
  if (missing.length) { outlineMissing(missing); return; }

  var v = currentValues();
  var parts = {};
  if (CURRENT_KIND === 'part1' || CURRENT_KIND === 'both') {
    parts['1'] = { q1: v.q1.trim(), q2_level: v.q2_level, q2_comment: (v.q2_comment || '').trim(), q3: v.q3.trim() };
  }
  if (CURRENT_KIND === 'part2' || CURRENT_KIND === 'both') {
    parts['2'] = { q4: v.q4.trim(), q5: v.q5.trim(), q6: v.q6.trim(), q7: v.q7.trim(), q8: v.q8.trim() };
  }

  SENDING = true;
  var prevText = btn.textContent;
  btn.classList.add('disabled');
  btn.textContent = 'Sending…';
  setFieldsDisabled(true);

  for (;;) {
    var data = null;
    try {
      data = await fetchJSON(SB_FN_REFLECT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: CURRENT_TOKEN, parts: parts })
      });
    } catch (e) { data = null; }

    if (data && data.success === true) {
      clearDraft(CURRENT_TOKEN);
      CURRENT_STATE = data.state;
      SENDING = false;
      renderView(deriveView(CURRENT_STATE));
      return;
    }
    if (data && data.success === false && data.error === 'missing_answers') {
      SENDING = false;
      btn.classList.remove('disabled');
      btn.textContent = prevText;
      setFieldsDisabled(false);
      outlineMissing(data.missing);
      updateSendState();
      return;
    }
    if (data && data.success === false) {
      // any other business miss (not_open / Record not found / etc): hard
      // rule 12, never show an error, quietly refresh state and re-render.
      SENDING = false;
      setFieldsDisabled(false);
      await loadState();
      return;
    }
    // network / timeout / parse failure: retry silently.
    await sleep(RETRY_DELAY_MS);
  }
}

// v0.37-style bfcache guard: a stale tab restored from suspension can hang
// its next fetch forever; reload to a clean context before the teacher
// notices anything.
window.addEventListener('pageshow', function (event) {
  if (event.persisted) location.reload();
});

loadState();
</script>
</body>
</html>
